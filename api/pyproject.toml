[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S101"]  # asserts permitidos en tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# B008: Depends()/Query() en defaults es el patrón idiomático de FastAPI
"app/**/router.py" = ["B008"]
"app/**/webhook_router.py" = ["B008"]
"app/core/auth.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
