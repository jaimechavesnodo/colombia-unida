services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: colombia_unida
      POSTGRES_USER: colombia_unida
      POSTGRES_PASSWORD: colombia_unida
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colombia_unida"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_local
      MINIO_ROOT_PASSWORD: minio_local_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"

  api:
    build: ./api
    environment: &app_env
      APP_ENV: local
      PORT: "80"
      ROOT_PATH: ""
      DATABASE_URL: postgresql+psycopg://colombia_unida:colombia_unida@db:5432/colombia_unida
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minio_local
      S3_SECRET_KEY: minio_local_secret
      CLAMAV_HOST: clamav
      # En local se siembra todo al arrancar: migraciones (siempre, vía
      # entrypoint), catálogo/geografía/roles y el escenario de demostración.
      RUN_SEEDS: "1"
      SEED_DEMO: "1"
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./api
    command: python -m app.worker
    environment:
      <<: *app_env
      # Las semillas las corre solo la API: dos contenedores sembrando a la
      # vez sobre la misma base es una carrera innecesaria.
      RUN_SEEDS: "0"
      SEED_DEMO: "0"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
