# Colombia Unida — servidor web unificado.
# Sirve las dos SPAs y hace proxy del API. Traefik enruta
# nodo.host/colombia-unida → este contenedor (:80).

server {
    listen 80;
    server_name _;

    # Location relativo en las redirecciones. Traefik termina el TLS y habla
    # http con este contenedor, así que si nginx construye la URL absoluta la
    # arma con "http://" y el navegador da un salto extra para volver a https.
    absolute_redirect off;

    # Límite generoso solo para el webhook/media; el API valida tamaños reales.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ── API (FastAPI) ──────────────────────────────────────────────
    # /colombia-unida/api/... → api:80/...  (se remueve el prefijo)
    location /colombia-unida/api/ {
        proxy_pass http://colombia-unida_api:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }

    # ── Redirecciones a la forma canónica con barra final ─────────
    # "location /ruta/" no captura "/ruta" sin barra: sin estas dos líneas,
    # entrar a nodo.host/colombia-unida da 404. Y no sirve dejar que nginx
    # ponga la barra solo, porque con `alias` no lo hace.
    location = /colombia-unida {
        return 301 /colombia-unida/;
    }
    location = /colombia-unida/consola {
        return 301 /colombia-unida/consola/;
    }

    # ── Consola de agentes ────────────────────────────────────────
    location /colombia-unida/consola/ {
        alias /usr/share/nginx/html/consola/;
        index index.html;
        try_files $uri $uri/ /colombia-unida/consola/index.html;
    }

    # ── Feed público ──────────────────────────────────────────────
    location /colombia-unida/ {
        alias /usr/share/nginx/html/web/;
        index index.html;
        try_files $uri $uri/ /colombia-unida/index.html;
    }

    location = / {
        return 301 /colombia-unida/;
    }

    # Health check para EasyPanel
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
